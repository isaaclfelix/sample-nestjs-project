# pnpm 12+ requires an explicit allow/deny for dependency lifecycle scripts
# (strictDepBuilds). @scarf/scarf is transitive telemetry from OpenAPI tooling;
# deny it so installs succeed without running its postinstall.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  # Optional native addon for dockerode/ssh; fails without a C toolchain — deny.
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: true
  # Optional ssh2 crypto binding; pure-JS path is enough for local Docker.
  ssh2: false
